        <circle class="bloom b" cx="616" cy="140" r="17" fill="url(#winGlow)"/>
        <circle class="bloom c" cx="722" cy="140" r="17" fill="url(#winGlow)"/>
        <circle class="bloom b" cx="500" cy="168" r="14" fill="url(#winGlow)"/>
