      <!-- viaduct -->
      <g fill="#BFAB80" stroke="#574732" stroke-width="1.1">
        <path d="M196 246v-44h188v44z"/>
      </g>
      <g fill="#DCCBA4" stroke="#574732" stroke-width="1">
        <path d="M212 246v-20a13 13 0 0 1 26 0v20z"/>
        <path d="M256 246v-20a13 13 0 0 1 26 0v20z"/>
        <path d="M300 246v-20a13 13 0 0 1 26 0v20z"/>
        <path d="M344 246v-20a13 13 0 0 1 26 0v20z"/>
