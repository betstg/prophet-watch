<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#E7D8B8"/>
          <stop offset="100%" stop-color="#DCCBA4"/>
        </linearGradient>
        <radialGradient id="moonGlow">
          <stop offset="0%" stop-color="#F5E4B8" stop-opacity=".30"/>
          <stop offset="100%" stop-color="#F5E4B8" stop-opacity="0"/>
        </radialGradient>
        <pattern id="ht" width="3" height="3" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r=".62" fill="currentColor"/>
        </pattern>
        <radialGradient id="winGlow">
          <stop offset="0%" stop-color="#9C8459" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#9C8459" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <rect width="1200" height="300" fill="url(#sky)"/>

      <g class="layer" data-depth="0.30" opacity="0" fill="#F6EFDC">
        <circle class="twinkle" cx="70" cy="42" r="1.3"/>
        <circle class="twinkle b" cx="148" cy="86" r="1"/>
        <circle class="twinkle c" cx="222" cy="34" r="1.5"/>
        <circle cx="300" cy="70" r="1"/>
        <circle class="twinkle b" cx="372" cy="26" r="1.2"/>
        <circle cx="452" cy="58" r="1"/>
        <circle class="twinkle c" cx="536" cy="30" r="1.4"/>
        <circle cx="628" cy="62" r="1"/>
        <circle class="twinkle" cx="702" cy="24" r="1.2"/>
        <circle cx="784" cy="54" r="1"/>
        <circle class="twinkle b" cx="866" cy="32" r="1.4"/>
        <circle cx="930" cy="96" r="1"/>
        <circle class="twinkle c" cx="1064" cy="40" r="1.2"/>
        <circle cx="1136" cy="76" r="1"/>
        <circle class="twinkle" cx="1178" cy="30" r="1.3"/>
      </g>

      <g class="shooter" opacity="0">
        <path d="M1150 20 l46 -22" stroke="#F6EFDC" stroke-width="1.6"
              stroke-linecap="round" opacity=".55"/>
        <circle cx="1150" cy="20" r="2" fill="#FFF7E4"/>
      </g>

      <g class="layer" data-depth="0.22" opacity="0">
        <circle cx="1016" cy="66" r="74" fill="url(#moonGlow)"/>
        <circle cx="1016" cy="66" r="25" fill="#F3E5BE"/>
        <circle cx="1026" cy="58" r="4" fill="#E2D3AC"/>
        <circle cx="1008" cy="74" r="5.5" fill="#E2D3AC"/>
        <circle cx="1020" cy="80" r="2.6" fill="#E2D3AC"/>
