          <path class="wing l" d="M0 0 C-10 -9 -19 -8 -24 -2 C-17 3 -7 4 0 0Z"/>
          <path class="wing r" d="M0 0 C10 -9 19 -8 24 -2 C17 3 7 4 0 0Z"/>
