      <rect y="246" width="1200" height="54" fill="#CDBB93"/>
      <g stroke="#574732" stroke-width="1" opacity=".45">
        <path d="M120 262h90"/><path d="M250 274h64"/><path d="M420 258h120"/>
        <path d="M600 270h80"/><path d="M760 260h100"/><path d="M960 272h70"/>
