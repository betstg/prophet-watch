          <path class="wing r" d="M0 0 C10 -9 19 -8 24 -2 C17 3 7 4 0 0Z"/>
          <ellipse cx="0" cy="2" rx="5" ry="6.5"/>
          <circle cx="0" cy="-4.5" r="4"/>
          <rect x="-4" y="8" width="8" height="6" rx="1" fill="#E9DCC0" stroke="#6E5C43" stroke-width=".8"/>
        </g>
      </g>
      <g class="owl b" fill="#6E5C43">
        <g class="owl-bob" transform="translate(0 122) scale(.72)">
