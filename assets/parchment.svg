<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <linearGradient id="age" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFE9D8"/>
      <stop offset="52%" stop-color="#E5E0D2"/>
      <stop offset="100%" stop-color="#D8D1BE"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" fill="url(#age)"/>
  <rect width="240" height="240" filter="url(#grain)" opacity="0.10"/>
</svg>
