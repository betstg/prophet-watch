name: Redacao do Prophet Watch

# De tres em tres horas. O vigia e de graca, entao acordar sempre custa nada,
# e o modelo so entra quando aparece materia nova de verdade.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redacao
  cancel-in-progress: false

jobs:
  fechar-edicao:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o que a redacao usa
        run: pip install --quiet pillow

      - name: Rodar a redacao
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 redacao/redacao.py

      - name: Publicar a edicao
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nada mudou, nao ha o que publicar."
            exit 0
          fi
          git config user.name "Redacao do Prophet Watch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Edicao de $(date -u +%d\ de\ %B\ de\ %Y)"
          git push
